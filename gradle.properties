org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
loom.ignoreDependencyLoomVersionValidation=true
copyBuildJar=true

# Mod Attributes
modId=hoveringhotbar
modName=Hovering Hotbar
modVersion=21.5.0
modAuthor=Fuzs
modDescription=Makes your hotbar seemingly float in place by shifting it a few pixels upward.
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/hovering-hotbar
modIssueUrl=https://github.com/Fuzss/hovering-hotbar/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/hoveringhotbar.json
modMavenGroup=fuzs.hoveringhotbar
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=IGNORE_ALL_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=client

# Version Catalog
dependenciesVersionCatalog=1.21.5-SNAPSHOT
#dependenciesPuzzlesLibVersion=21.5.9
#dependenciesMinPuzzlesLibVersion=21.5.9

# Mod Publishing
projectReleaseType=release
